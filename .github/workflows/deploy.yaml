# Builds the site from main and puts it in the S3 bucket CloudFront serves.
#
# Needs, in the repository's Actions settings:
#   variables  CHANNEL_URL                 the channel the site is built from (see .env.example)
#              S3_BUCKET                   the bucket the site is served from
#              S3_REGION                   its region
#              CLOUDFRONT_DISTRIBUTION_ID  the distribution in front of it
#   secrets    AWS_ACCESS_KEY_ID, AWS_SECRET_ACCESS_KEY   a user allowed to write the bucket and invalidate the distribution
#
# The bucket's policy grants public read of every object (owner, 2026-10-31); nothing here sets an ACL.
#
# The build's forwarding stubs become S3 website redirects (a real 301, as the old site's were) after the sync.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build only; touch neither the bucket nor CloudFront
        type: boolean
        default: false
      all_redirects:
        description: Set every forward again, not only the new and changed ones
        type: boolean
        default: false

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    environment: Production
    steps:
      - uses: actions/checkout@v5

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, iconv
          coverage: none

      - name: Install dependencies
        run: composer install --no-dev --no-interaction --prefer-dist --optimize-autoloader

      - name: Build the site
        env:
          CHANNEL_URL: ${{ vars.CHANNEL_URL }}
        run: vendor/bin/jigsaw build production

      - name: Record the build
        run: date -u +%Y-%m-%dT%H:%M:%SZ > build_production/build.txt

      - name: Configure AWS
        if: ${{ !inputs.dry_run }}
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.S3_REGION }}

      - name: Note the forwards as deployed
        if: ${{ !inputs.dry_run }}
        # The rules the last deploy set, so only new or changed ones are set this time (the build dates every stub
        # 2000-01-01, so the sync leaves an unchanged one, and the redirect object in its place, alone).
        run: |
          aws s3 cp "s3://${{ vars.S3_BUCKET }}/_redirects" deployed-redirects --only-show-errors 2>/dev/null || true
          touch deployed-redirects

      - name: Sync with S3
        if: ${{ !inputs.dry_run }}
        # The bucket's policy grants public read, so objects need no ACL of their own. Three passes, for the cache
        # lifetimes: pages and files always checked (CloudFront is invalidated each deploy); the stylesheet, the script
        # and Turbo are named for their contents or version, kept for a year; the rest of the assets, a month.
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          aws s3 sync build_production/ "s3://$BUCKET/" --delete --only-show-errors --exclude "assets/*" --cache-control "public, max-age=0, must-revalidate"
          aws s3 sync build_production/ "s3://$BUCKET/" --delete --only-show-errors --exclude "*" --include "assets/site.*.css" --include "assets/site.*.js" --include "assets/turbo.*.js" --cache-control "public, max-age=31536000, immutable"
          aws s3 sync build_production/ "s3://$BUCKET/" --delete --only-show-errors --exclude "*" --include "assets/*" --exclude "assets/site.*.css" --exclude "assets/site.*.js" --exclude "assets/turbo.*.js" --cache-control "public, max-age=2592000"

      - name: Set the forwards as website redirects
        if: ${{ !inputs.dry_run }}
        # Each new or changed rule in _redirects (from to 301) becomes an empty object at the old address that S3
        # answers with a 301, replacing the stub page the build wrote there. An old address with its own slash is its
        # index.html. Sixteen at once.
        env:
          BUCKET: ${{ vars.S3_BUCKET }}
        run: |
          : > empty
          if [ "${{ inputs.all_redirects }}" = "true" ]; then cp build_production/_redirects changed-redirects; else comm -13 <(sort deployed-redirects) <(sort build_production/_redirects) > changed-redirects; fi
          echo "forwards: $(wc -l < build_production/_redirects), to set: $(wc -l < changed-redirects)"
          awk 'NF >= 2 {
            key = substr($1, 2);
            if (key ~ /\/$/) key = key "index.html";
            else if (key !~ /\./) key = key "/index.html";
            print key "\t" $2
          }' changed-redirects | xargs -r -P 16 -L 1 sh -c 'aws s3api put-object --bucket "$BUCKET" --key "$0" --website-redirect-location "$1" --content-type text/html --body empty > /dev/null'

      - name: Invalidate CloudFront
        if: ${{ !inputs.dry_run }}
        run: aws cloudfront create-invalidation --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" --paths "/*" > /dev/null
